# Configuration externalisée du projet (Partie 7).
# Chaque clé absente est remplacée par une valeur par défaut dans ConfigLoader.
app {
  name = "EcommerceAnalytics"

  spark {
    master = "local[*]"
    shuffle.partitions = 8
  }

  optimization {
    enable-cache     = true   # cache() / persist() / unpersist()
    enable-broadcast = true   # broadcast() des petites tables lors des jointures
  }

  data {
    input {
      transactions = "src/main/resources/data/transactions.csv"
      users        = "src/main/resources/data/users.json"
      products     = "src/main/resources/data/products.parquet"
      merchants    = "src/main/resources/data/merchants.csv"
    }
    output {
      path = "output/"
    }
  }

  validation {
    transaction { timestamp-length = 14 }
    user        { min-age = 16, max-age = 100 }
    product     { min-rating = 1.0, max-rating = 5.0 }
    merchant    { min-commission = 0.0, max-commission = 1.0 }
  }

  analytics {
    active-user-min-days    = 5     # Q3.3 : jours distincts minimum sur 7 jours glissants
    window-days             = 7     # Q3.3 : taille de la fenêtre glissante
    suspicious-amount-pct   = 300.0 # Q3.4 : dépassement du panier moyen (%)
    suspicious-delay-min    = 5.0   # Q3.4 : délai minimal entre deux achats (minutes)
    suspicious-min-conditions = 2   # Q3.4 : nombre de conditions pour être suspect
  }
}
